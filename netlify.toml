# Netlify Configuration for LionStone Floors

[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets (images only get long cache; JS/CSS revalidate)
[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
  from = "/calendar/*"
  to = "/calendar/index.html"
  status = 200

[[redirects]]
  from = "/calendar"
  to = "/calendar/index.html"
  status = 200

[[redirects]]
  from = "/thank-you/*"
  to = "/thank-you/index.html"
  status = 200

[[redirects]]
  from = "/thanks/*"
  to = "/thank-you/index.html"
  status = 200

